name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Pick the branch with `--ref`:
  #     gh workflow run rust.yml --ref my-branch
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1 (master)
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-llvm-cov

      # run `cargo fmt --all` if red
      - name: Format check
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --verbose

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --verbose

      - name: Coverage (unit tests)
        run: cargo llvm-cov --lcov --output-path lcov.info --fail-under-lines 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          flags: unit,${{ matrix.os }}
          name: unit-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}


  fuzz:
    name: Fuzz the image version scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # cargo-fuzz needs nightly for -Z sanitizer; the crate itself builds on stable.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1 (master)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-fuzz

      # Without this the leg starts empty every run and throws away its 120s of
      # coverage-guided search, so a bug it once caught may not be caught again.
      # `github.run_id` never repeats, so the key always misses and the grown corpus always
      # saves; `restore-keys` pulls the newest previous one back in.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      # Tracked inputs that must never stop being tested — every one is a past crash. The
      # cache expires and a cold fork has none, so it cannot be what carries them.
      - name: Seed the corpus
        run: |
          for dir in fuzz/seeds/*/; do
            target=$(basename "$dir")
            mkdir -p "fuzz/corpus/$target"
            cp -v "$dir"* "fuzz/corpus/$target/" 2>/dev/null || true
          done
          ls -l fuzz/corpus/* || true

      # The only entry point fed bytes gcscope does not control, and below 3.11 the sole
      # version source. Covers goblin's header parsing and the fat-slice arithmetic too,
      # which is where the hang fixed in `parse_macho` lived. Time-boxed to a smoke gate;
      # run it longer locally when touching the scanner or memory::binary.
      #
      # `--target` is not optional: cargo-fuzz bakes its default in at *its own* build
      # time, and the prebuilt binary install-action fetches is musl-built, so it defaults
      # to x86_64-unknown-linux-musl, which is not installed here and is crt-static, which
      # ASAN refuses. Derive the real host triple rather than hardcoding one, so this
      # survives a runner architecture change.
      - name: Fuzz scan_image_for_version
        run: |
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          echo "host triple: $HOST"
          cargo fuzz run --target "$HOST" scan_image_for_version -- -max_total_time=120 -rss_limit_mb=4096

      # A red leg is worthless without the input that caused it, and libFuzzer's own dump
      # truncates for large inputs. base64 the artifact into the log rather than adding an
      # upload action to the supply chain.
      - name: Emit the crashing input
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for f in fuzz/artifacts/*/*; do
            found=1
            echo "::group::$f ($(stat -c%s "$f") bytes)"
            base64 "$f"
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "No artifact written; the failure was not a crash."


  matrix-unpinned:
    name: Python matrices stay unpinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # A python matrix only guards against a patch-release struct change because
      # setup-python floats each entry to the newest patch. Pin one and that guard dies
      # silently — the leg still passes, it just stops testing anything new. This is the
      # constraint ADR 0010 section 2 states; nothing enforced it until now.
      #
      # Scans every `python:` matrix. The Probe leg added a second one, and a guard stopping at
      # `head -1` would have left it unchecked while still reporting green.
      - name: Reject pinned patch versions in any python matrix
        run: |
          LINES=$(grep -nE "^ *python: \[.*\]" .github/workflows/rust.yml || true)
          echo "$LINES"
          # Rename the matrix key and this guard finds nothing, which reads as a pass. Fail.
          if [ -z "$LINES" ]; then
            echo "::error::no python matrix found in rust.yml; this guard has drifted"
            exit 1
          fi
          PINNED=$(printf '%s' "$LINES" | grep -oE "'[0-9]+\.[0-9]+\.[0-9]+t?'" || true)
          if [ -n "$PINNED" ]; then
            echo "::error::a python matrix pins a patch version: $PINNED"
            echo "Entries must be bare '3.x' so setup-python floats to the newest patch."
            echo "See ADR 0010 section 2 — the float IS the patch-drift guard."
            exit 1
          fi
          echo "All entries are bare minor versions."

  live-smoke:
    name: gc-stats smoke (${{ matrix.os }} py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.16 omitted (not in the setup-python registry yet). 3.15t is the one
        # free-threaded leg — the only build reaching the 1/1/1 ring geometry.
        # 3.15 is left FLOATING: setup-python picks the newest pre-release and gcscope
        # refuses one it has no exact layout for, so these legs go red when a new beta/rc
        # ships. Don't fix a red 3.15 by pinning — regenerate offsets and register.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15', '3.15t']
        # macOS: 3.13+ attaches unprivileged (PEP 768 get-task-allow); 3.8-3.12 needs root.
        # Flagged per-version because GitHub expressions can't compare versions.
        include:
          - { python: '3.8',  macos_needs_root: 'yes' }
          - { python: '3.9',  macos_needs_root: 'yes' }
          - { python: '3.10', macos_needs_root: 'yes' }
          - { python: '3.11', macos_needs_root: 'yes' }
          - { python: '3.12', macos_needs_root: 'yes' }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1 (master)
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Allow ptrace (best-effort)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Configure macOS taskport permissions
        if: runner.os == 'macOS'
        run: |
          id $(whoami)
          sudo security authorizationdb write system.privilege.taskport is-developer
          sudo security authorizationdb read system.privilege.taskport

      - name: Describe the macOS Python image
        if: runner.os == 'macOS'
        run: |
          PYBIN="$(python -c 'import sys; print(sys.executable)')"
          # The executable is a stub; the runtime lives in the framework dylib.
          FW="$(python -c 'import sysconfig,os; print(os.path.join(sysconfig.get_config_var("prefix"), "Python"))')"
          for f in "$PYBIN" "$FW"; do
            echo "===== $f ====="
            [ -e "$f" ] || { echo "(absent)"; continue; }
            file "$f"
            otool -l "$f" 2>/dev/null | grep -B2 -A4 'PyRuntime' || echo "(no PyRuntime section)"
            nm -m "$f" 2>/dev/null | grep -i 'pyruntime\|py_version' || echo "(no matching symbols)"
            codesign -dv --entitlements - "$f" 2>&1 | grep -i 'flags\|runtime\|get-task-allow' \
              || echo "(unsigned / no signing info)"
          done

      - name: Attach, detect version, assert GC-stats shape
        if: runner.os != 'macOS' || matrix.macos_needs_root != 'yes'
        shell: bash
        run: cargo llvm-cov --test live_smoke --lcov --output-path lcov.info --fail-under-lines 1 -- --ignored --nocapture

      # macOS pre-3.13 needs root to attach, and cargo/rustup live in the user's HOME, not
      # root's — so instrument via show-env, build the test binary unprivileged, run it as
      # root, make the root-written profiles readable, then report.
      - name: Attach, detect version, assert GC-stats shape (sudo)
        if: runner.os == 'macOS' && matrix.macos_needs_root == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          # Write-then-source, NOT `source <(...)`: process substitution discards show-env's
          # exit status, so a failure there silently leaves the run uninstrumented and only
          # surfaces later as "not found *.profraw files".
          cargo llvm-cov show-env --export-prefix > "$RUNNER_TEMP/llvm-cov-env.sh"
          echo "--- cargo llvm-cov show-env ---"; cat "$RUNNER_TEMP/llvm-cov-env.sh"
          source "$RUNNER_TEMP/llvm-cov-env.sh"
          cargo llvm-cov clean --workspace
          export GCSCOPE_TEST_PYTHON="$(command -v python)"
          BIN=$(cargo test --test live_smoke --no-run --message-format=json \
                | jq -r 'select(.executable != null and .target.name == "live_smoke") | .executable' \
                | head -1)
          echo "test binary: $BIN"
          # Fail here, named, if instrumentation env never applied — rather than letting it
          # surface downstream as the misleading "not found *.profraw files".
          : "${LLVM_PROFILE_FILE:?show-env set no LLVM_PROFILE_FILE; the run would not be instrumented}"
          # `sudo env VAR=...` rather than `sudo -E`: -E depends on sudoers env_keep/SETENV and
          # silently drops vars, leaving the root-run binary writing its profile elsewhere.
          sudo env LLVM_PROFILE_FILE="$LLVM_PROFILE_FILE" \
                   GCSCOPE_TEST_PYTHON="$GCSCOPE_TEST_PYTHON" \
                   "$BIN" --ignored --nocapture
          # Default rather than a bare reference: show-env's exact variable names are not a
          # stable contract, and `set -u` turns a wrong guess into a hard failure here.
          COV_DIR="${CARGO_LLVM_COV_TARGET_DIR:-target/llvm-cov-target}"
          sudo chown -R "$(whoami)" "$COV_DIR" || true
          echo "--- profraw in $COV_DIR ---"
          find "$COV_DIR" -name '*.profraw' 2>/dev/null | head -20 \
            || echo "(none — the root-run binary wrote no profile)"
          cargo llvm-cov report --lcov --output-path lcov.info --fail-under-lines 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          flags: smoke,${{ matrix.os }}
          name: smoke-${{ matrix.os }}-py${{ matrix.python }}
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  custom-build-smoke:
    name: gc-stats smoke (source ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # upload_name is `label` restricted to [A-Za-z0-9._-] — the same charset Codecov
          # requires of flag names — because the uploader passes `name` as a URL query
          # parameter, where '+' decodes to a space. It is hygiene, not a fix: a session
          # literally named 'smoke-custom-3.15+inc' did produce a complete report
          # (42f47d8), so '+' is not what caused the "Missing Head Report" outage.
          # Derive it by hand, not from `label` (GitHub expressions have no string-replace).
          - label: '3.15+inc'
            upload_name: 'smoke-custom-3.15-inc'
            repo: sergey-miryanov/cpython
            ref: 'feat/gc-gen-3.15+inc'
            provenance_file: ''
            expect_extended: 'yes'
          - label: '3.16.0a0'
            upload_name: 'smoke-custom-3.16.0a0'
            repo: python/cpython
            ref: ''
            provenance_file: 'src/remote_debugging/offsets/v_3_16_0a0.rs'
            expect_extended: 'no'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1 (master)
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-llvm-cov

      - name: Resolve interpreter commit
        id: rev
        run: |
          REF="${{ matrix.ref }}"
          if [ -z "$REF" ]; then
            REF=$(grep -oE 'gcscope-source: [^@]+@[0-9a-f]{40}' "${{ matrix.provenance_file }}" \
                  | head -1 | grep -oE '[0-9a-f]{40}')
            [ -z "$REF" ] && { echo "::error::no gcscope-source pin in ${{ matrix.provenance_file }}"; exit 1; }
            echo "Pinned from ${{ matrix.provenance_file }}: $REF"
          fi
          SHA=$(git ls-remote "https://github.com/${{ matrix.repo }}" "$REF" | cut -f1)
          [ -z "$SHA" ] && SHA="$REF"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.label }} @ $SHA"

      - name: Cache built interpreter
        id: cache-py
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/cpython-build
          key: cpython-${{ matrix.label }}-${{ steps.rev.outputs.sha }}

      - name: Build CPython from source
        if: steps.cache-py.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev libffi-dev
          git init src && cd src
          git remote add origin "https://github.com/${{ matrix.repo }}"
          git fetch --depth 1 origin "${{ steps.rev.outputs.sha }}"
          git checkout FETCH_HEAD
          ./configure --prefix="$HOME/cpython-build"
          make -j"$(nproc)"
          make install

      - name: Allow ptrace (best-effort)
        run: sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Attach, detect version, assert GC-stats shape
        shell: bash
        run: |
          PY="$HOME/cpython-build/bin/python3"
          "$PY" --version
          export GCSCOPE_TEST_PYTHON="$PY"
          [ "${{ matrix.expect_extended }}" = "yes" ] && export GCSCOPE_EXPECT_EXTENDED=1
          cargo llvm-cov --test live_smoke --lcov --output-path lcov.info --fail-under-lines 1 -- --ignored --nocapture

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          flags: smoke,custom-build
          name: ${{ matrix.upload_name }}
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:
    name: integration tests (attach)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1 (master)
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Allow ptrace (best-effort)
        run: sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: "Run the 'ignored' integration tests"
        run: cargo test --features test-hooks --tests -- --ignored

      - name: Coverage (integration tests)
        run: cargo llvm-cov --features test-hooks --tests --lcov --output-path lcov.info --fail-under-lines 1 -- --ignored

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          flags: integration,ubuntu-latest
          name: integration-ubuntu-latest
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}


  # Decides whether the Probe contract leg below runs, so a docs-only pull request keeps its
  # current turnaround. `git diff` rather than a `paths:` filter, because `paths:` gates the
  # whole workflow file and every other job in it has to keep running.
  #
  # The list below is wide on purpose. ADR 0016 section 4 makes this leg the price of path
  # filtering: the Probe and gcscope's decoder share a layout contract, and a pull request that
  # breaks it from the *reader* side has to go red on that pull request rather than on whichever
  # later one happens to touch C. So the gate opens on all of `src/`.
  probe-scope:
    name: Scope the Probe leg
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: decide
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # A push to main and a manual dispatch have no base to diff against, and guessing
          # wrong there costs more than the four minutes the leg takes.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "event is ${{ github.event_name }}; the contract leg always runs."
            exit 0
          fi
          # Fetch the base rather than trusting `origin/$BASE` to exist. actions/checkout
          # leaves different things in refs/remotes depending on version and inputs, and a
          # missing ref fails `git diff` and skips the leg, which is the one outcome this gate
          # must never produce by accident.
          git fetch --no-tags --quiet origin "$BASE"
          CHANGED=$(git diff --name-only FETCH_HEAD...HEAD)
          echo "::group::changed files"; echo "$CHANGED"; echo "::endgroup::"
          # A herestring keeps `grep -q` out of a pipeline. `-q` exits at the first match, and
          # under `set -o pipefail` the SIGPIPE'd producer makes the pipeline non-zero even
          # though the pattern matched, routing a matching change to the else branch. That is
          # the silent skip the comment above forbids.
          if grep -qE '^(gcscope_probe/|src/|tests/|scripts/gen-offsets\.py$|Cargo\.(toml|lock)$|\.github/workflows/rust\.yml$)' <<< "$CHANGED"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Reaches the Probe contract; the leg runs."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Touches neither the Probe nor gcscope's reader; skipping the leg."
          fi

  # The contract leg ADR 0016 section 4 calls non-optional: build a Probe on a machine that is
  # not the maintainer's Windows box, attach to it, and assert the Records decode. Without it,
  # "the Probe works" rests on nobody having checked.
  #
  # `specs/0015-publish-probe-wheels.md` owns wheels, musllinux and publishing. This builds one
  # module from source on each OS and throws it away.
  #
  # The release store on `ts_stop` earns its keep on the macOS runner. `macos-latest` is Apple
  # Silicon from macos-14 on, so this leg runs native arm64, the only configuration that can
  # order those writes differently from x86-64's TSO. Spec 0013 section 5 case 3 rules out
  # emulation as a stand-in. `Assert the macOS leg is arm64` below fails if GitHub ever moves
  # the label back to Intel, so that coverage cannot disappear unnoticed.
  probe-contract:
    name: Probe contract (${{ matrix.os }} py${{ matrix.python }})
    needs: probe-scope
    if: needs.probe-scope.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every OS gcscope claims. Each builds the Probe with its own toolchain (gcc, MSVC or
        # Apple clang) against its own interpreter's internal headers, so a construct only one
        # of them rejects goes red here instead of at a user.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Both minors the Probe supports, and the one place the leg's interpreter is named. They
        # differ in more than a number: 3.13 takes the other arm of the include split in
        # `src/internals.c`, and its `_gc_runtime_state` has no `heap_size` at all, so only this
        # entry proves the Probe reports that field as absent rather than reading whatever sits
        # at the offset. Bare minor, floated by setup-python, and `matrix-unpinned` enforces
        # that, for the reason ADR 0010 section 2 gives: a pinned entry stops testing anything
        # new.
        #
        # This leg compiles the Probe against whatever patch release setup-python hands it, and
        # the offsets come from that interpreter's own internal headers (ADR 0013), so a moved
        # offset never reaches the test. The leg catches the other failure: a field that moved
        # out from under the mechanism. On 3.14 `tests/probe.rs` requires a written entry's
        # `heap_size` to clear the fixture's live-object count, so a wrong offset fails the leg
        # instead of publishing 0.
        #
        # 3.13 has no such field to check, which leaves `offsets_ok` as the only thing holding
        # `offsetof(PyInterpreterState, gc)` up there. The header's capability word carries it
        # now, so `tests/probe.rs` asserts it from outside the process on both minors.
        #
        # The 3.14 entry is also the only one that can fail the `heap_size` check on purpose:
        # `probe_reports_a_suppressed_heap_size` displaces the offset and asserts the Probe
        # suppresses the field, and there is nothing to displace on 3.13, where it skips.
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1 (master)
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-llvm-cov
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Allow ptrace (best-effort)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Configure macOS taskport permissions
        if: runner.os == 'macOS'
        run: |
          sudo security authorizationdb write system.privilege.taskport is-developer
          sudo security authorizationdb read system.privilege.taskport

      # This leg carries the project's only arm64 coverage, and it is arm64 because of a label
      # rather than anything the workflow states. A move back to Intel would leave every
      # assertion passing while proving nothing about publication ordering, the one defect
      # class x86-64 cannot exhibit.
      - name: Assert the macOS leg is arm64
        if: runner.os == 'macOS'
        run: |
          arch="$(uname -m)"
          echo "runner architecture: $arch"
          [ "$arch" = "arm64" ] || {
            echo "::error::macos-latest is $arch, not arm64; the release store on ts_stop is" \
                 "no longer covered by any leg. See specs/0013-probe-portable-core.md section 5."
            exit 1
          }

      # No compiler or interpreter path appears here; setuptools finds the toolchain (gcc, MSVC
      # or Apple clang). A compile error fails the leg at this step, named, rather than
      # downstream as a test that found no module.
      #
      # This needs the interpreter's *internal* headers, which belong to the runner's Python
      # rather than to anything in this repository. Both `make install` and the standalone
      # builds setup-python uses carry them; a Python without them stops here with the
      # diagnostic `src/internals.c` raises.
      - name: Build and install the Probe
        shell: bash
        run: python -m pip install --verbose ./gcscope_probe

      # GCSCOPE_REQUIRE_PROBE=1 stops a skip reading as a pass. The test skips when no Probe is
      # installed, which is right on a laptop and would turn a Probe that failed to compile
      # into a green leg here.
      #
      # `--include-ignored` rather than `--ignored`: the export-table assertion needs no attach,
      # so it is a plain test, and `--ignored` runs only the ones marked. This is the leg that
      # has a built module to inspect, so it is the leg that has to run it.
      #
      # `sys.executable` rather than `command -v python`: under `shell: bash` on Windows that
      # resolves to an MSYS path like `/c/hostedtoolcache/...`, which the Rust harness hands
      # straight to `Command::new` and Windows cannot open. `sys.executable` is native on all
      # three runners.
      - name: Attach and assert the Ring decodes
        shell: bash
        env:
          GCSCOPE_REQUIRE_PROBE: '1'
        run: |
          GCSCOPE_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export GCSCOPE_TEST_PYTHON
          echo "interpreter: $GCSCOPE_TEST_PYTHON"
          # The self-check, in process. `tests/probe.rs` now asserts the same fact from the
          # region header's capability word, which is where a real consumer reads it; this stays
          # because it needs no attach. A leg whose ptrace or taskport permissions are wrong
          # fails every test below for that reason and would leave the offsets unexamined,
          # whereas this says plainly which of the two happened.
          #
          # It compares `gcstate->collecting` against the 1 it must be inside a gc callback, so it
          # validates `offsetof(PyInterpreterState, gc)` and `collecting` together. `heap_size`
          # answers separately, through the causal check in `gcscope_probe_validate_heap_size`,
          # and reports separately in the same word.
          #
          # `offsets_ok` reads 0 until a Collection has run with the callback installed, so this
          # installs and collects rather than calling geometry() straight after import. `-P` keeps
          # the checkout off sys.path, where the source directory `gcscope_probe/` would otherwise
          # be a candidate for the import.
          "$GCSCOPE_TEST_PYTHON" -P - <<'PY'
          import gc, gcscope_probe
          gcscope_probe.install()
          gc.collect(0)
          geometry = gcscope_probe.geometry()
          print(geometry)
          if not geometry["offsets_ok"]:
              raise SystemExit(
                  "::error::the Probe's self-check failed: gcstate->collecting did not read 1 "
                  "inside a gc callback, so the compiled-in interpreter offsets are wrong for "
                  "this build and every read through them is garbage"
              )
          PY
          cargo llvm-cov --test probe --lcov --output-path lcov.info --fail-under-lines 1 -- --include-ignored --nocapture

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          flags: probe,${{ matrix.os }}
          name: probe-${{ matrix.os }}-py${{ matrix.python }}
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
