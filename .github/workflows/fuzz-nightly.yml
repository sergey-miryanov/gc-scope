name: Fuzz (nightly)

# The long-run counterpart to CI's 120s smoke gate. Separate from rust.yml so a nightly tick
# does not drag its 27-leg live matrix along — same reasoning as offsets-sweep.yml.
#
# The corpus outlives any one run's findings: caches written on the default branch are
# readable from every branch, so each night deepens what later PRs restore. CI's gate alone
# grows it 120s per merge.
#
# Nightly, not weekly: GitHub drops caches untouched for 7 days, so a weekly tick sits on
# the eviction boundary; a regression surfaces next morning rather than next Monday; and
# short repeated searches resample a heavy-tailed distribution where one long run stalls.
on:
  schedule:
    - cron: '0 4 * * *'   # nightly, 04:00 UTC
  workflow_dispatch:
  # Also on machinery changes, so a broken job fails the PR that breaks it.
  pull_request:
    paths:
      - 'fuzz/**'
      - '.github/workflows/fuzz-nightly.yml'

permissions:
  contents: read

# A dispatch overlapping the schedule would have both writing the corpus cache, and the
# loser's exploration discarded. Queue instead.
concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    name: Explore and grow the corpus
    runs-on: ubuntu-latest
    env:
      # A PR here only proves the job still runs; it should not cost ten minutes.
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 60 || 600 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # cargo-fuzz needs nightly for -Z sanitizer; the crate itself builds on stable.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1 (master)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-fuzz

      # The `fuzz-corpus-` prefix MUST match rust.yml. Diverge it and the two jobs stop
      # feeding each other, which is the point of running this one.
      #
      # Restore and save are split because the combined action skips its save on failure,
      # discarding the corpus of the run that found a crash.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Seed the corpus
        run: |
          for dir in fuzz/seeds/*/; do
            target=$(basename "$dir")
            mkdir -p "fuzz/corpus/$target"
            cp "$dir"* "fuzz/corpus/$target/" 2>/dev/null || true
          done

      # `--target` is not optional, for rust.yml's reason: the prebuilt cargo-fuzz is
      # musl-built, so it defaults to a target that is absent here and is crt-static, which
      # ASAN refuses.
      - name: Fuzz scan_image_for_version
        run: |
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          before=$(find fuzz/corpus/scan_image_for_version -type f 2>/dev/null | wc -l)
          echo "corpus in: $before inputs; budget: ${FUZZ_SECONDS}s"
          cargo fuzz run --target "$HOST" scan_image_for_version -- \
            -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096
          after=$(find fuzz/corpus/scan_image_for_version -type f 2>/dev/null | wc -l)
          echo "corpus out: $after inputs (+$((after - before)))"

      # Every run that restores the corpus pays to transfer it, and near-duplicate inputs
      # dilute the fuzzer's mutation effort for no new coverage. Minimizing costs a chunk of
      # a run's budget, so it gets its own night.
      - name: Minimize the corpus (Mondays)
        if: github.event_name != 'pull_request'
        run: |
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday (ISO day $(date -u +%u)); skipping minimization."
            exit 0
          fi
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          before=$(find fuzz/corpus/scan_image_for_version -type f 2>/dev/null | wc -l)
          cargo fuzz cmin --target "$HOST" scan_image_for_version
          after=$(find fuzz/corpus/scan_image_for_version -type f 2>/dev/null | wc -l)
          echo "minimized: $before -> $after inputs"

      # No PR to attach a failure to, so the input has to reach the log. libFuzzer's dump
      # truncates; base64 rather than adding an upload action to the supply chain.
      - name: Emit the crashing input
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for f in fuzz/artifacts/*/*; do
            found=1
            echo "::group::$f ($(stat -c%s "$f") bytes)"
            base64 "$f"
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "No artifact written; the failure was not a crash."

      # `always()` so a crash-finding run still contributes its corpus. Not on pull_request:
      # that cache is scoped to the PR branch, where nothing reads it.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.event_name != 'pull_request'
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
