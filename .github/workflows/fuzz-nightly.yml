name: Fuzz (nightly)

# The long-run counterpart to CI's 120s smoke gate. Time-driven and outside CI proper so a
# nightly tick does not drag the 27-leg live matrix with it — same reasoning as
# offsets-sweep.yml.
#
# What this is for is the corpus it leaves behind, not the findings of any one run. Caches
# written on the default branch are restorable from every branch, so each night's
# exploration lands in the corpus that later PRs restore, and CI's gate starts deeper than
# it otherwise could. On its own that gate only grows the shared corpus by 120s per merge.
#
# Nightly rather than weekly for three reasons: GitHub drops cache entries untouched for 7
# days, so a weekly tick sits on the eviction boundary and can silently lose everything
# during a quiet stretch; a regression surfaces the next morning instead of the next
# Monday; and six independent searches resample a heavy-tailed distribution that one long
# search can get stuck in.
on:
  schedule:
    - cron: '0 4 * * *'   # nightly, 04:00 UTC
  workflow_dispatch:
  # Also on changes to the machinery itself, so a broken job is caught by the PR that
  # breaks it rather than at 04:00 the next morning.
  pull_request:
    paths:
      - 'fuzz/**'
      - '.github/workflows/fuzz-nightly.yml'

permissions:
  contents: read

# A manual dispatch during a scheduled run would have both writing the corpus cache, and
# the loser's exploration would be discarded. Queue instead.
concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    name: Explore and grow the corpus
    runs-on: ubuntu-latest
    env:
      # A PR here is only proving the job still works; it should not cost ten minutes.
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 60 || 600 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # cargo-fuzz needs nightly for -Z sanitizer; the crate itself builds on stable.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 1.97.1 (master)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-fuzz

      # The `fuzz-corpus-` prefix MUST match the one in rust.yml. Diverge it and the two
      # jobs stop feeding each other, which is the entire point of running this one.
      #
      # Restore and save are split rather than using the combined action because a run that
      # finds a crash fails, and the combined action skips its save on failure — throwing
      # away the exploration of exactly the run that proved most productive.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Seed the corpus
        run: |
          for dir in fuzz/seeds/*/; do
            target=$(basename "$dir")
            mkdir -p "fuzz/corpus/$target"
            cp "$dir"* "fuzz/corpus/$target/" 2>/dev/null || true
          done

      # `--target` is not optional here for the same reason as in rust.yml: the prebuilt
      # cargo-fuzz is musl-built, so it defaults to a target that is not installed and is
      # crt-static, which ASAN refuses.
      - name: Fuzz scan_image_for_version
        run: |
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          before=$(find fuzz/corpus/scan_image_for_version -type f 2>/dev/null | wc -l)
          echo "corpus in: $before inputs; budget: ${FUZZ_SECONDS}s"
          cargo fuzz run --target "$HOST" scan_image_for_version -- \
            -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096
          after=$(find fuzz/corpus/scan_image_for_version -type f 2>/dev/null | wc -l)
          echo "corpus out: $after inputs (+$((after - before)))"

      # libFuzzer re-executes the whole corpus at startup, so an unminimized corpus grows
      # until CI's 120s gate spends its budget replaying instead of exploring — the long
      # run slowly poisons the thing it exists to improve. Minimizing costs a chunk of a
      # run's budget, so it gets its own night rather than every night.
      - name: Minimize the corpus (Mondays)
        if: github.event_name != 'pull_request'
        run: |
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday (ISO day $(date -u +%u)); skipping minimization."
            exit 0
          fi
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          before=$(find fuzz/corpus/scan_image_for_version -type f 2>/dev/null | wc -l)
          cargo fuzz cmin --target "$HOST" scan_image_for_version
          after=$(find fuzz/corpus/scan_image_for_version -type f 2>/dev/null | wc -l)
          echo "minimized: $before -> $after inputs"

      # No PR to attach a failure to, so the input has to reach the log. libFuzzer's own
      # dump truncates; base64 rather than adding an upload action to the supply chain.
      - name: Emit the crashing input
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for f in fuzz/artifacts/*/*; do
            found=1
            echo "::group::$f ($(stat -c%s "$f") bytes)"
            base64 "$f"
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "No artifact written; the failure was not a crash."

      # `always()` so a crash-finding run still contributes its corpus. Not on pull_request:
      # that cache would be scoped to the PR branch, where nothing else would ever read it.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.event_name != 'pull_request'
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
