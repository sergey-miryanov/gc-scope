[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcscope-probe"
version = "0.1.0"
description = "Publish per-Collection GC timing from inside CPython, for gcscope to read"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sergey Miryanov", email = "sergey.miryanov@gmail.com" }]
keywords = ["gc", "garbage-collection", "profiling", "gcscope"]

# PyInit repeats this gate at import, and tightens it to the patch release: a wheel tag pins the
# minor and the stable ABI, and neither covers the internal struct layout the offsets in
# `src/internals.c` are taken from. 3.12 and below have no public PyTime_PerfCounterRaw; 3.15
# publishes these statistics itself.
requires-python = ">=3.13,<3.15"

# No license classifier: PEP 639 supersedes it, and setuptools refuses both together.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: C",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/sergey-miryanov/gc-scope"
Source = "https://github.com/sergey-miryanov/gc-scope"

# No [tool.setuptools] packages: this distribution is one extension module. It is declared in
# setup.py, since ext-modules in pyproject.toml is still experimental.
